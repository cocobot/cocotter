[package]
name = "galipeur"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "galipeur"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[dependencies]
log = "0.4"
amatheur = { path = "../libs/amatheur" }
asserv = { path = "../libs/asserv", features = ["rome"] }
board-common = { path = "../boards/common" }
board-sabotter = { path = "../boards/sabotter" }
embedded-can = "0.4"
embedded-hal = "1.0"
flume = { version = "0.11", default-features = false }
cancaner = { path = "../libs/cancaner" }
pathfinding = { path = "../libs/pathfinding" }
rome = { path = "../libs/rome" }

[target.'cfg(not(target_os = "espidf"))'.dependencies]
sim_client = { path = "../libs/sim_client" }
sim_protocol = { path = "../libs/sim_protocol" }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.52"
ble = { path = "../libs/ble" }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
